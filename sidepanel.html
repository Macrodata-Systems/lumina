<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">
        <header>
            <h1>Lumina</h1>
            <div class="header-actions">
                <button id="theme-toggle" class="icon-btn">🌙</button>
                <button id="settings-btn" class="icon-btn">⚙️</button>
            </div>
        </header>

        <div id="main-view">
            <button id="explain-btn" class="hidden">Explain Page</button>

            <div id="results-container" class="hidden">
                <div class="result-section" id="gemini-section">
                    <div class="section-header">
                        <h3>✨ Gemini</h3>
                        <button class="config-btn" data-target="gemini-key">⚙️</button>
                    </div>
                    <div class="content"></div>
                </div>
                <div class="result-section" id="openai-section">
                    <div class="section-header">
                        <h3>🤖 ChatGPT</h3>
                        <button class="config-btn" data-target="openai-key">⚙️</button>
                    </div>
                    <div class="content"></div>
                </div>
                <div class="result-section" id="anthropic-section">
                    <div class="section-header">
                        <h3>🧠 Claude</h3>
                        <button class="config-btn" data-target="anthropic-key">⚙️</button>
                    </div>
                    <div class="content"></div>
                </div>
            </div>
        </div>

        <div id="settings-view" class="hidden">
            <h2>Settings</h2>
            <div class="input-group">
                <div class="label-row">
                    <label for="gemini-key">Gemini API Key</label>
                    <a href="https://aistudio.google.com/app/apikey" target="_blank" class="help-link">Get Key</a>
                </div>
                <input type="password" id="gemini-key" placeholder="Enter Gemini API Key">
            </div>
            <div class="input-group">
                <div class="label-row">
                    <label for="openai-key">OpenAI API Key</label>
                    <a href="https://platform.openai.com/api-keys" target="_blank" class="help-link">Get Key</a>
                </div>
                <input type="password" id="openai-key" placeholder="Enter OpenAI API Key">
            </div>
            <div class="input-group">
                <div class="label-row">
                    <label for="anthropic-key">Anthropic API Key</label>
                    <a href="https://console.anthropic.com/settings/keys" target="_blank" class="help-link">Get Key</a>
                </div>
                <input type="password" id="anthropic-key" placeholder="Enter Anthropic API Key">
            </div>
            <button id="save-settings-btn" class="secondary-btn">Save</button>
            <button id="back-btn" class="text-btn">Back</button>
        </div>
    </div>
    <script type="module" src="sidepanel.js"></script>
</body>

</html>

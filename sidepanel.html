<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
        integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="container">


        <div id="setup-view">
            <div class="setup-content">
                <div class="logo-large">💎</div>
                <h1>Welcome to Lumina</h1>
                <p>Your AI Copilot for the Web.</p>

            </div>
        </div>

        <div id="main-view" class="hidden">
            <div class="controls-wrapper">
                <div class="super-prompt-bar">
                    <!-- Left: Source Toggles -->
                    <div class="source-toggles">
                        <button id="toggle-screenshot" class="source-btn" title="Toggle Screenshot"><i
                                class="fa-solid fa-camera"></i></button>
                        <button id="toggle-pagetext" class="source-btn active" title="Toggle Page Text"><i
                                class="fa-solid fa-file-lines"></i></button>
                    </div>

                    <!-- Center: Input -->
                    <div class="input-wrapper">
                        <textarea id="custom-prompt" placeholder="Ask AI... (Type or Speak)" rows="1"></textarea>
                    </div>

                    <!-- Right: Actions -->
                    <div class="action-buttons">
                        <div style="width: 1px; height: 16px; background: var(--border-color); margin: 0 4px;"></div>
                        <button id="mic-btn" class="icon-action-btn" title="Voice Input"><i
                                class="fa-solid fa-microphone"></i></button>
                        <button id="load-text-btn" class="icon-action-btn" title="Paste Page Text"><i
                                class="fa-solid fa-file-import"></i></button>
                        <button id="send-btn" class="icon-action-btn primary" title="Send"><i
                                class="fa-solid fa-paper-plane"></i></button>
                    </div>
                </div>

                <div class="chips-container">
                    <div class="chips">
                        <button class="chip" data-prompt="Summarize this" title="Get a quick summary">Summary</button>
                        <button class="chip" data-prompt="Guide me through learning this"
                            title="Learn step-by-step">Guided Learning</button>
                        <button class="chip" data-prompt="Do a deep research on this"
                            title="Deep research analysis">Deep Research</button>
                        <button class="chip" data-prompt="Track my work based on this" title="Track your progress">Track
                            Work</button>
                        <button class="chip" data-prompt="Give commentary on this"
                            title="Get detailed commentary">Commentary</button>
                    </div>

                    <div class="header-actions">
                        <button id="theme-toggle" class="icon-action-btn" title="Toggle Theme">🌙</button>
                        <button id="settings-btn" class="icon-action-btn" title="Settings">⚙️</button>
                    </div>
                </div>

                <button id="explain-btn" class="hidden">Explain Page</button>

                <div class="tabs">
                    <button class="tab-btn" data-tab="openai-section" title="ChatGPT by OpenAI">🤖 ChatGPT</button>
                    <button class="tab-btn active" data-tab="gemini-section" title="Gemini by Google">✨ Gemini</button>
                    <button class="tab-btn" data-tab="anthropic-section" title="Claude by Anthropic">🧠 Claude</button>
                    <button class="tab-btn" data-tab="grok-section" title="Grok by xAI">🤘 Grok</button>
                    <button class="tab-btn" data-tab="deepseek-section" title="DeepSeek AI">🦈 DeepSeek</button>
                    <button class="tab-btn" data-tab="history-section" title="View conversation history">📜
                        History</button>
                </div>




            </div>

            <div id="results-container" class="hidden">
                <div class="result-section active-section" id="gemini-section">
                    <div class="section-header">
                        <h3>Gemini Response</h3>
                        <div class="header-actions-small">
                            <button class="refresh-btn" data-target="gemini" title="Refresh response"><i
                                    class="fa-solid fa-arrow-rotate-right"></i></button>
                            <button class="config-btn" data-target="gemini-key" title="Configure API key">⚙️</button>
                        </div>
                    </div>
                    <div class="content"></div>
                </div>
                <div class="result-section" id="openai-section">
                    <div class="section-header">
                        <h3>ChatGPT Response</h3>
                        <div class="header-actions-small">
                            <button class="refresh-btn" data-target="openai" title="Refresh response"><i
                                    class="fa-solid fa-arrow-rotate-right"></i></button>
                            <button class="config-btn" data-target="openai-key" title="Configure API key">⚙️</button>
                        </div>
                    </div>
                    <div class="content"></div>
                </div>
                <div class="result-section" id="anthropic-section">
                    <div class="section-header">
                        <h3>Claude Response</h3>
                        <div class="header-actions-small">
                            <button class="refresh-btn" data-target="anthropic" title="Refresh response"><i
                                    class="fa-solid fa-arrow-rotate-right"></i></button>
                            <button class="config-btn" data-target="anthropic-key" title="Configure API key">⚙️</button>
                        </div>
                    </div>
                    <div class="content"></div>
                </div>
                <div class="result-section" id="grok-section">
                    <div class="section-header">
                        <h3>Grok Response</h3>
                        <div class="header-actions-small">
                            <button class="refresh-btn" data-target="grok" title="Refresh response"><i
                                    class="fa-solid fa-arrow-rotate-right"></i></button>
                            <button class="config-btn" data-target="grok-key" title="Configure API key">⚙️</button>
                        </div>
                    </div>
                    <div class="content"></div>
                </div>
                <div class="result-section" id="deepseek-section">
                    <div class="section-header">
                        <h3>DeepSeek Response</h3>
                        <div class="header-actions-small">
                            <button class="refresh-btn" data-target="deepseek" title="Refresh response"><i
                                    class="fa-solid fa-arrow-rotate-right"></i></button>
                            <button class="config-btn" data-target="deepseek-key" title="Configure API key">⚙️</button>
                        </div>
                    </div>
                    <div class="content"></div>
                </div>
                <!-- History Section -->
                <div class="result-section" id="history-section">
                    <div class="section-header">
                        <h3>History</h3>
                        <div class="header-actions-small">
                            <button id="clear-history-btn" title="Clear History" class="icon-action-btn"><i
                                    class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                    <div class="history-list-container">
                        <!-- Items injected here -->
                        <div class="empty-state">No history yet. Start explaining things!</div>
                    </div>
                </div>
            </div>

            <!-- Global Footer Chat Prompt -->
            <div id="global-chat-footer" class="hidden">
                <div class="chat-input-container">
                    <textarea class="chat-input" placeholder="Ask follow-up question.." rows="1"></textarea>
                    <button id="chat-mic-btn" class="chat-send-btn" title="Voice Input"
                        style="background: transparent; color: var(--text-secondary);">
                        <i class="fa-solid fa-microphone"></i>
                    </button>
                    <button class="chat-send-btn" title="Send message">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                    <button class="chat-clear-btn" title="Clear chat history">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>

        </div>

        <div id="settings-view" class="hidden">
            <h2>Settings</h2>
            <!-- Freemium Settings -->
            <div class="input-group">
                <div class="label-row">
                    <label for="gemini-key">Gemini API Key</label>
                    <button class="paste-btn" data-target="gemini-key" title="Paste from clipboard">Paste Key</button>
                </div>
                <input type="password" id="gemini-key" placeholder="Enter Gemini API Key">
            </div>



            <!-- Pro Settings (Hidden until unlocked) -->
            <div id="pro-model-settings" class="hidden">
                <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
                <!-- <h3 style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 10px;">Pro Model Keys</h3> -->

                <div class="input-group">
                    <div class="label-row">
                        <label for="openai-key">OpenAI API Key</label>
                        <button class="paste-btn" data-target="openai-key" title="Paste from clipboard">Paste
                            Key</button>
                    </div>
                    <input type="password" id="openai-key" placeholder="Enter OpenAI API Key">
                </div>
                <div class="input-group">
                    <div class="label-row">
                        <label for="anthropic-key">Anthropic API Key</label>
                        <button class="paste-btn" data-target="anthropic-key" title="Paste from clipboard">Paste
                            Key</button>
                    </div>
                    <input type="password" id="anthropic-key" placeholder="Enter Anthropic API Key">
                </div>
                <div class="input-group">
                    <div class="label-row">
                        <label for="grok-key">Grok API Key</label>
                        <button class="paste-btn" data-target="grok-key" title="Paste from clipboard">Paste Key</button>
                    </div>
                    <input type="password" id="grok-key" placeholder="Enter Grok API Key">
                </div>
                <div class="input-group">
                    <div class="label-row">
                        <label for="deepseek-key">DeepSeek API Key</label>
                        <button class="paste-btn" data-target="deepseek-key" title="Paste from clipboard">Paste
                            Key</button>
                    </div>
                    <input type="password" id="deepseek-key" placeholder="Enter DeepSeek API Key">
                </div>
            </div>

            <button id="save-settings-btn" class="secondary-btn" style="margin-top: 15px;"
                title="Save all settings">Save</button>
            <button id="back-btn" class="text-btn" title="Return to main view">Back</button>

            <div class="footer-info">
                <p>&copy; 2026 Harsh Raj Singh. All Rights Reserved.</p>
                <div class="footer-links">
                    <a href="https://github.com/singhharsh199" target="_blank" title="About the Developer">About Me</a>
                    •
                    <a href="https://www.linkedin.com/in/singhharsh199/" target="_blank"
                        title="Contact on LinkedIn">Contact Us</a>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="sidepanel.js"></script>
</body>

</html>

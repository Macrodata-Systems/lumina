<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upgrade to Lumina Pro</title>
    <style>
        :root {
            --primary-color: #10a37f;
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            max-width: 440px;
            width: 100%;
            text-align: center;
            border: 1px solid var(--border-color);
        }

        h1 {
            margin: 0 0 10px 0;
            color: #fff;
            font-size: 1.6rem;
        }

        .step-label {
            font-size: 0.85rem;
            color: #888;
            text-align: left;
            margin-bottom: 8px;
            display: block;
            border-left: 3px solid var(--primary-color);
            padding-left: 10px;
        }

        .price-tag {
            background: rgba(16, 163, 127, 0.1);
            color: var(--primary-color);
            padding: 8px 16px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.4rem;
            display: inline-block;
            margin: 15px 0;
            border: 1px solid var(--primary-color);
        }

        .gateway-section {
            display: none;
            text-align: left;
            animation: fadeIn 0.5s;
        }

        .gateway-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 10px;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            filter: brightness(1.1);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            background: #444 !important;
            color: #888;
            cursor: not-allowed;
        }

        .qr-box {
            background: white;
            padding: 12px;
            border-radius: 12px;
            margin: 15px auto;
            width: 180px;
            height: 180px;
        }

        .qr-box img {
            width: 100%;
            height: 100%;
        }

        .bank-details {
            background: #252525;
            padding: 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 0.85rem;
        }

        .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 6px;
            border-bottom: 1px solid #333;
            padding-bottom: 6px;
        }

        .row:last-child {
            border: none;
            padding: 0;
            margin: 0;
        }

        .lbl {
            color: #888;
        }

        .val {
            color: #fff;
            font-family: monospace;
        }

        .loader {
            margin: 40px 0;
            color: #666;
            font-size: 0.9rem;
        }

        input[type="email"] {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border-radius: 8px;
            border: 1px solid #444;
            background: #111;
            color: white;
            margin-bottom: 20px;
            outline: none;
            font-size: 1rem;
        }

        input[type="email"]:focus {
            border-color: var(--primary-color);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 Unlock Lumina Pro</h1>

        <!-- STEP 1: EMAIL -->
        <span class="step-label">1. Enter email for your key:</span>
        <input type="email" id="user-email" placeholder="example@gmail.com">

        <!-- STEP 2: PAYMENT -->
        <span class="step-label">2. Pay for your subscription:</span>
        <div id="loader" class="loader">📍 Detecting location...</div>

        <!-- INDIA VIEW -->
        <div id="view-in" class="gateway-section">
            <div style="text-align: center;">
                <div class="price-tag">₹500 <span style="font-size: 0.6em;">/ YEAR</span></div>
                <div class="qr-box"><img id="upi-qr" src="" alt="Scan Me"></div>
                <div class="bank-details">
                    <div class="row"><span class="lbl">UPI ID</span> <span class="val" id="upi-id-display">...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- GLOBAL VIEW -->
        <div id="view-global" class="gateway-section">
            <div style="text-align: center;">
                <div class="price-tag">$6.00 <span style="font-size: 0.6em;">/ YEAR</span></div>
                <button id="paypal-btn" class="btn" style="background:#0070ba; color:white; display:none;">Paid with
                    PayPal</button>
                <div class="bank-details">
                    <div style="margin-bottom:8px; color:var(--primary-color); font-weight:bold;">🇬🇧 UK / Bank
                        Transfer</div>
                    <div class="row"><span class="lbl">Sort Code</span> <span class="val">30-99-62</span></div>
                    <div class="row"><span class="lbl">Account</span> <span class="val">25686568</span></div>
                    <div class="row"><span class="lbl">Name</span> <span class="val">Harsh Singh</span></div>
                </div>
            </div>
        </div>

        <!-- STEP 3: ACTION -->
        <div style="margin-top: 25px; border-top: 1px solid #333; padding-top: 20px;">
            <span class="step-label">3. Receive your License:</span>
            <button id="request-key-btn" class="btn" style="background: var(--primary-color); color: white;">
                Email My Key Now 🚀
            </button>
            <p id="status-msg" style="margin-top:12px; font-size: 0.85rem; min-height: 1.2em;"></p>
        </div>
    </div>

    <script type="module" src="payment.js"></script>
</body>

</html>
